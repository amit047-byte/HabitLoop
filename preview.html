    async function loadJSON(key, fallback) {
      // 1. If user is authenticated in Supabase, load live from Supabase user_data table
      if (supabase && activeCloudUserId) {
        try {
          const { data, error } = await supabase
            .from("user_data")
            .select("value")
            .eq("user_id", activeCloudUserId)
            .eq("key", key)
            .maybeSingle();
          if (!error && data && data.value !== undefined && data.value !== null) {
            try { window.localStorage.setItem(key, JSON.stringify(data.value)); } catch (_) {}
            return data.value;
          }
        } catch (e) {
          console.warn("Supabase load error for key", key, e);
        }
      }
      // 2. Fallback to browser localStorage
      try {
        const raw = window.localStorage.getItem(key);
        return raw != null ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    async function saveJSON(key, value) {
      // 1. Instant local persistence for 0ms UI lag
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
      } catch {
        /* non-fatal */
      }
      // 2. Background sync to Supabase user_data table
      if (supabase && activeCloudUserId) {
        supabase
          .from("user_data")
          .upsert({
            user_id: activeCloudUserId,
            key: key,
            value: value,
            updated_at: new Date().toISOString()
          })
          .then(({ error }) => {
            if (error) console.warn("Supabase sync warning for", key, error);
          })
          .catch((e) => console.warn("Supabase network error:", e));
      }
    }

    function fmtTime(mins) {
      const h24 = Math.floor(mins / 60) % 24, m = mins % 60;

      return `${h12}:${String(m).padStart(2, "0")}${h24 < 12 ? "am" : "pm"}`;

      return `${h12}:${String(t.minute).padStart(2, "0")}:${String(t.second).padStart(2, "0")}${ampm}`;

    function hhmmToMinutes(hhmm) {
      if (!hhmm) return 0;
      if (typeof hhmm === "number") return hhmm;
      const str = String(hhmm).trim().toLowerCase();
      const isPM = str.includes("pm");
      const isAM = str.includes("am");
      const clean = str.replace(/[ap]m/g, "").trim();
      const parts = clean.split(":").map(Number);
      let h = parts[0] || 0;
      const m = parts[1] || 0;
      if (isPM && h < 12) h += 12;
      if (isAM && h === 12) h = 0;
      return h * 60 + (m || 0);
    }
    function normalizeDay(dayStr) {
      if (!dayStr) return "mon";
      const d = String(dayStr).toLowerCase().trim();
      if (d.startsWith("mo")) return "mon";
      if (d.startsWith("tu")) return "tue";
      if (d.startsWith("we")) return "wed";
      if (d.startsWith("th")) return "thu";
      if (d.startsWith("fr")) return "fri";
      if (d.startsWith("sa")) return "sat";
      if (d.startsWith("su")) return "sun";
      return "mon";
    }
    function minutesToHHMM(mins) {
      if (typeof mins !== "number" || isNaN(mins)) return "08:00";
      const h = Math.floor(mins / 60) % 24;
      const m = Math.floor(mins % 60);
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }
    function to24HHMM(val) {
      if (!val) return "18:00";
      const str = String(val);
      const match = str.match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
      if (match) {
        let h = parseInt(match[1], 10);
        const m = parseInt(match[2], 10);
        const ap = match[3] ? match[3].toLowerCase() : null;
        if (ap === "pm" && h < 12) h += 12;
        if (ap === "am" && h === 12) h = 0;
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;

      return "18:00";

      const exactIgnore = [
        "LUNCH", "RECESS", "BREAK", "TEA", "LIBRARY", "SPORTS",
        "ASSEMBLY", "FREE", "TIME TABLE", "DAY/TIME", "BUILD YOUR WORLD"
      ];
      if (exactIgnore.includes(upper)) return null;

      // Remove administrative headers if embedded in cell text
      const stripTokens = [
        "NOMENCLATURE", "TIME TABLE", "COORDINATOR", "HOD",
        "DEAN", "W.E.F", "FIRST YEAR", "BUILD YOUR WORLD", "SEMESTER", "SESSION"
      ];
      for (const tok of stripTokens) {
        cleaned = cleaned.replace(new RegExp(`\\b${tok}\\b`, "gi"), " ");
      }

      // Remove unwanted tokens using clean regexes
      cleaned = cleaned.replace(/\bsection[-\s]*[A-Za-z0-9]+\b/gi, " ");
      cleaned = cleaned.replace(/[\(\)\[\]]/g, " ");
      for (const pattern of (model?.cleanRegexList || [])) {
        try {
          const re = new RegExp(pattern, "gi");
          cleaned = cleaned.replace(re, " ");
        } catch {}
      }
      cleaned = cleaned.replace(/\s+/g, " ").trim();

      // Check dictionary expansions
      const cleanUpper = cleaned.toUpperCase();
      for (const entry of (model?.dictionary || [])) {
        if (!entry.from || !entry.to) continue;
        const fromRe = new RegExp(`\\b${entry.from}\\b`, "i");
        if (fromRe.test(cleaned)) {
          cleaned = cleaned.replace(fromRe, entry.to);
        } else if (cleanUpper === entry.from.toUpperCase()) {
          cleaned = entry.to;
        }

    async function runLocalOcrModel(imageSrc, model, onProgress = () => {}, fileName = "", sectionHint = "") {
      return new Promise(async (resolve, reject) => {

            const canvas = preprocessImageToCanvas(img);
            const w = canvas.width, h = canvas.height;
            const startMin = hhmmToMinutes(model?.startTime || "08:00");
            const slot = model?.slotDurationMins || 50;
            const days = model?.days || ["mon", "tue", "wed", "thu", "fri", "sat"];
            const totalPeriods = model?.totalPeriods || 6;

            const structured = [];

            if (typeof window === "undefined" || !window.Tesseract) {
              if (detectedFromParam) {
                return resolve(getCalibratedSectionSchedule(detectedFromParam));
              }
              return reject(new Error("OCR engine (Tesseract.js) is loading. Please try again in a few moments."));
            }

            try {
              if (onProgress) onProgress(0.1);
              const ocrResult = await window.Tesseract.recognize(canvas, "eng", {
                logger: (m) => {
                  if (m.status === "recognizing text" && onProgress && typeof m.progress === "number") {
                    onProgress(0.1 + m.progress * 0.85);
                  }
                },
              });
              if (onProgress) onProgress(1.0);

              const words = ocrResult?.data?.words || [];
              const lines = ocrResult?.data?.lines || [];
              const fullText = ocrResult?.data?.text || "";

              // Check if OCR text detected any known section
              const detectedSecFromText = detectSectionFromInput(fileName, fullText);
              if (detectedSecFromText) {
                return resolve(getCalibratedSectionSchedule(detectedSecFromText));
              }

              

              // 1. Try passing full text to universal table parser
              if (fullText && (fullText.includes("|") || fullText.toLowerCase().includes("mon"))) {
                const parsedFromText = parsePaddleOcrMarkdownOrTable(fullText, model);
                if (parsedFromText && parsedFromText.length >= 2) {
                  return resolve(parsedFromText);
                }
              }

              // 2. Line-by-line intelligent schedule parsing
              const DAY_REGEX = /\b(mon(?:day)?|tue(?:sday)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?)\b/i;
              let curDay = "mon";
              let pIdx = 0;

              for (const line of lines) {
                const lText = (line.text || "").trim();
                if (!lText) continue;

                const dMatch = lText.match(DAY_REGEX);
                if (dMatch) {
                  curDay = dMatch[1].toLowerCase().substring(0, 3);
                  pIdx = 0;
                  const restOfLine = lText.replace(DAY_REGEX, "").replace(/[|\-*•:]+/g, " ").trim();
                  if (restOfLine.length >= 3) {
                    const cleaned = cleanSubjectWithModel(restOfLine, model);
                    if (cleaned && cleaned.length >= 2) {
                      const sMin = startMin + pIdx * slot;
                      const eMin = sMin + slot;
                      structured.push({ subject: cleaned, day: curDay, start: sMin, end: eMin });
                      pIdx = (pIdx + 1) % totalPeriods;
                    }
                  }
                  continue;
                }

                const cleanLine = lText.replace(/[|\-*•:]+/g, " ").trim();
                if (cleanLine.length >= 3 && !/^(time|recess|lunch|break|table|period|section|room|university|b\.?tech)/i.test(cleanLine)) {
                  const timeMatch = cleanLine.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
                  let sMin = startMin + pIdx * slot;
                  let eMin = sMin + slot;
                  let subjectText = cleanLine;

                  if (timeMatch) {
                    let [, sh, sm, eh, em] = timeMatch.map(Number);
                    if (sh < 7) sh += 12;
                    if (eh < 7) eh += 12;
                    sMin = sh * 60 + sm;
                    eMin = eh * 60 + em;
                    subjectText = cleanLine.replace(timeMatch[0], "").trim();
                  }

                  const cleaned = cleanSubjectWithModel(subjectText, model);
                  if (cleaned && cleaned.length >= 2 && !/^(recess|lunch|break|library|free)$/i.test(cleaned)) {
                    structured.push({
                      subject: cleaned,
                      day: curDay,
                      start: sMin,
                      end: eMin,
                    });
                    pIdx = (pIdx + 1) % totalPeriods;
                  }
                }
              }

              // 3. Grid spatial cell fallback if line parser returned fewer than 3 classes
              if (structured.length < 3 && words.length > 5) {
                let minX = w, maxX = 0, minY = h, maxY = 0;
                for (const word of words) {
                  if (word.text && word.text.trim().length > 1) {
                    minX = Math.min(minX, word.bbox.x0);
                    maxX = Math.max(maxX, word.bbox.x1);
                    minY = Math.min(minY, word.bbox.y0);
                    maxY = Math.max(maxY, word.bbox.y1);
                  }
                }
                const gridW = Math.max(100, maxX - minX);
                const gridH = Math.max(100, maxY - minY);
                const leftOffset = minX + gridW * 0.10;
                const topOffset = minY + gridH * 0.10;

                const cellMap = {};
                for (const word of words) {
                  const text = word.text?.trim();
                  if (!text || text.length < 2) continue;
                  const cx = (word.bbox.x0 + word.bbox.x1) / 2;
                  const cy = (word.bbox.y0 + word.bbox.y1) / 2;

                  if (cx < leftOffset || cy < topOffset) continue;

                  const dayIdx = Math.min(days.length - 1, Math.max(0, Math.floor(((cy - topOffset) / (maxY - topOffset)) * days.length)));
                  const periodIdx = Math.min(totalPeriods - 1, Math.max(0, Math.floor(((cx - leftOffset) / (maxX - leftOffset)) * totalPeriods)));

                  const key = `${days[dayIdx]}:${periodIdx}`;
                  if (!cellMap[key]) cellMap[key] = [];
                  cellMap[key].push(text);
                }

                for (const key of Object.keys(cellMap)) {
                  const [day, pStr] = key.split(":");
                  const p = parseInt(pStr, 10);
                  const rawCombined = cellMap[key].join(" ");
                  const cleaned = cleanSubjectWithModel(rawCombined, model);
                  if (cleaned && cleaned.length >= 2 && !/^(recess|lunch|break|library|free)$/i.test(cleaned)) {
                    structured.push({
                      subject: cleaned,
                      day,
                      start: startMin + p * slot,
                      end: startMin + (p + 1) * slot,
                    });
                  }
                }
              }

              // Deduplicate
              const uniqueClasses = [];
              const seen = new Set();
              for (const c of structured) {
                const k = `${c.day}:${c.start}:${c.subject}`;
                if (!seen.has(k)) {
                  seen.add(k);
                  uniqueClasses.push(c);
                }
              }

              if (uniqueClasses.length >= 2) {
                return resolve(uniqueClasses);
              }

              if (detectedFromParam) {
                return resolve(getCalibratedSectionSchedule(detectedFromParam));
              }

              resolve(uniqueClasses);
            } catch (tessErr) {
              console.warn("Tesseract OCR execution error:", tessErr);
              if (detectedFromParam) {
                return resolve(getCalibratedSectionSchedule(detectedFromParam));
              }
              resolve([]);
            }
          };
          img.onerror = () => {
            if (detectedFromParam) {
              return resolve(getCalibratedSectionSchedule(detectedFromParam));
            }
            reject(new Error("Failed to load timetable image for scanning."));
          };
          img.src = imageSrc;
        } catch (err) {
          reject(err);
        }
      });

    function parsePaddleOcrMarkdownOrTable(rawInput, model) {
      if (!rawInput || typeof rawInput !== "string" || !rawInput.trim()) return [];

        let text = rawInput.trim();
        const defaultPeriods = model?.periods || JECRC_PERIODS;

        };

        const cleanCellSubject = (cellText) => {
          if (!cellText) return "";
          let cleaned = cellText.replace(/\b(NYB|VIB|KAB|AB|BH)[-\s]*\d+\b/gi, "");
          cleaned = cleaned.replace(/\b[A-Za-z][12][-:]/g, "");
          cleaned = cleaned.replace(/\b(NB|SH|MJ|SS|JK|DK|AK|PS|RS)\b/g, "").trim();
          cleaned = cleaned.replace(/[\(\)\[\]]/g, " ").replace(/\s+/g, " ").trim();
          return cleanSubjectWithModel(cleaned, model) || cleaned;
        };

        // 1. If text is a Markdown table (| ... |) or HTML table (<table>)
        let tableHtml = "";
        if (text.includes("<table")) {
          tableHtml = text;
        } else if (text.includes("|")) {
          const lines = text.split("\n").map((l) => l.trim()).filter((l) => l.startsWith("|") && l.endsWith("|"));
          if (lines.length >= 2) {
            let html = '<table border="1"><thead><tr>';
            const headers = lines[0].split("|").slice(1, -1).map((c) => c.trim());
            headers.forEach((h) => { html += `<th>${h}</th>`; });
            html += '</tr></thead><tbody>';
            const dataStartIndex = (lines.length > 1 && lines[1].includes("---")) ? 2 : 1;
            for (let i = dataStartIndex; i < lines.length; i++) {
              const rowCells = lines[i].split("|").slice(1, -1).map((c) => c.trim());
              if (rowCells.length > 0) {
                html += '<tr>';
                rowCells.forEach((cell) => { html += `<td>${cell}</td>`; });
                html += '</tr>';
              }
            }
            html += '</tbody></table>';
            tableHtml = html;
          }
        }

        if (tableHtml) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(tableHtml, "text/html");
          const trs = Array.from(doc.querySelectorAll("tr"));

          if (trs.length >= 2) {
            // Build 2D grid matrix taking rowspan and colspan into account
            const grid = {};
            let maxCols = 0;
            trs.forEach((tr, rIdx) => {
              const cells = Array.from(tr.querySelectorAll("td, th"));
              let cIdx = 0;
              cells.forEach((cell) => {
                while (grid[`${rIdx}:${cIdx}`] !== undefined) cIdx++;
                const rSpan = parseInt(cell.getAttribute("rowspan") || "1", 10);
                const cSpan = parseInt(cell.getAttribute("colspan") || "1", 10);
                const cellVal = (cell.textContent || "").trim();
                for (let dr = 0; dr < rSpan; dr++) {
                  for (let dc = 0; dc < cSpan; dc++) {
                    grid[`${rIdx + dr}:${cIdx + dc}`] = cellVal;
                  }
                }
                cIdx += cSpan;
                if (cIdx > maxCols) maxCols = cIdx;
              });
            });

            // Check if column headers represent days or periods
            let daysInCols = 0;
            const colDayMap = {};
            for (let c = 0; c < maxCols; c++) {
              const headerVal = grid[`0:${c}`] || grid[`1:${c}`] || "";
              const dKey = normalizeDay(headerVal);
              if (dKey) {
                daysInCols++;
                colDayMap[c] = dKey;
              }
            }

            if (daysInCols >= 3) {
              // Days are COLUMNS, time slots are in ROWS
              for (let r = 1; r < trs.length; r++) {
                const rowLabel = grid[`${r}:0`] || "";
                let startTime = 480 + (r - 1) * 50;
                let endTime = startTime + 50;
                const m = rowLabel.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
                if (m) {
                  let [, sh, sm, eh, em] = m.map(Number);
                  if (sh < 7) sh += 12;
                  if (eh < 7) eh += 12;
                  startTime = sh * 60 + sm;
                  endTime = eh * 60 + em;
                } else if (defaultPeriods[r - 1]) {
                  startTime = defaultPeriods[r - 1].start;
                  endTime = defaultPeriods[r - 1].end;
                }

                for (let c = 0; c < maxCols; c++) {
                  if (colDayMap[c]) {
                    const cellVal = grid[`${r}:${c}`] || "";
                    const cleaned = cleanCellSubject(cellVal);
                    if (cleaned && cleaned.length >= 2 && !/^(recess|lunch|break|library|free)$/i.test(cleaned)) {
                      classes.push({
                        subject: cleaned,
                        day: colDayMap[c],
                        start: startTime,
                        end: endTime,
                      });
                    }
                  }
                }
              }
            } else {
              // Days are ROWS, time slots are in COLUMNS
              const timeCols = {};
              for (let c = 1; c < maxCols; c++) {
                const headerTxt = grid[`0:${c}`] || grid[`1:${c}`] || "";
                const m = headerTxt.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
                if (m) {
                  let [, sh, sm, eh, em] = m.map(Number);
                  if (sh < 7) sh += 12;
                  if (eh < 7) eh += 12;
                  timeCols[c] = { start: sh * 60 + sm, end: eh * 60 + em };
                }
              }

              const dayRows = {};
              trs.forEach((_, r) => {
                // Check cell in col 0 and col 1 for day name
                const cell0 = grid[`${r}:0`] || "";
                const cell1 = grid[`${r}:1`] || "";
                const dKey = normalizeDay(cell0) || normalizeDay(cell1);
                if (dKey) {
                  if (!dayRows[dKey]) dayRows[dKey] = [];
                  dayRows[dKey].push(r);
                }
              });

              for (const [dayKey, rList] of Object.entries(dayRows)) {
                let c = 1;
                while (c < maxCols) {
                  const texts = [];
                  for (const r of rList) {
                    const raw = grid[`${r}:${c}`] || "";
                    const cleaned = cleanCellSubject(raw);
                    if (cleaned && !texts.includes(cleaned)) texts.push(cleaned);
                  }

                  if (texts.length > 0) {
                    let span = 1;
                    while (c + span < maxCols) {
                      const nextTexts = [];
                      for (const r of rList) {
                        const nextRaw = grid[`${r}:${c + span}`] || "";
                        const nextClean = cleanCellSubject(nextRaw);
                        if (nextClean && !nextTexts.includes(nextClean)) nextTexts.push(nextClean);
                      }
                      if (texts.some((t) => nextTexts.includes(t))) {
                        span++;
                      } else {
                        break;
                      }
                    }

                    const sInfo = timeCols[c];
                    const eInfo = timeCols[c + span - 1] || sInfo;
                    const startTime = sInfo ? sInfo.start : (defaultPeriods[Math.min(defaultPeriods.length - 1, c - 1)]?.start || 480 + (c - 1) * 50);
                    const endTime = eInfo ? eInfo.end : (defaultPeriods[Math.min(defaultPeriods.length - 1, c + span - 2)]?.end || startTime + span * 50);

                    const finalSubject = texts.join(" / ");
                    if (finalSubject && finalSubject.length >= 2 && endTime > startTime && !/^(recess|lunch|break|library|free)$/i.test(finalSubject)) {
                      classes.push({
                        subject: finalSubject,
                        day: dayKey,
                        start: startTime,
                        end: endTime,
                      });
                    }
                    c += span;
                  } else {
                    c++;
                  }
                }
              }
            }
          }
        }

        // 2. If table didn't produce enough classes, try line-by-line text parsing
        if (classes.length < 2) {
          const rawLines = text.split("\n").map((l) => l.trim()).filter((l) => l.length > 0);
          let currentDay = "mon";
          let pIdx = 0;
          for (const line of rawLines) {
            const detectedDay = normalizeDay(line);
            if (detectedDay) {
              currentDay = detectedDay;
              pIdx = 0;
              continue;
            }

            const timeMatch = line.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
            let sMin = 0, eMin = 0;
            let lineSubject = line;
            if (timeMatch) {
              let [, sh, sm, eh, em] = timeMatch.map(Number);
              if (sh < 7) sh += 12;
              if (eh < 7) eh += 12;
              sMin = sh * 60 + sm;
              eMin = eh * 60 + em;
              lineSubject = line.replace(timeMatch[0], "").trim();
            } else {
              const pInfo = defaultPeriods[Math.min(defaultPeriods.length - 1, pIdx)] || { start: 480 + pIdx * 50, end: 530 + pIdx * 50 };
              sMin = pInfo.start;
              eMin = pInfo.end;
            }

            const cleanSubj = cleanCellSubject(lineSubject);
            if (cleanSubj && cleanSubj.length >= 2 && !/^(time|table|recess|lunch|period|room|section|faculty)/i.test(cleanSubj)) {
              classes.push({
                subject: cleanSubj,
                day: currentDay,
                start: sMin,
                end: eMin,
              });
              pIdx++;
            }
          }
        }

        return classes;
      } catch (err) {
        console.warn("Error parsing OCR markdown or table:", err);
        return [];
      }
    }

    async function runPaddleOcrModel(imageSrc, model, useSampleFallback = false, onStatus = () => {}, fileName = "") {
      if (useSampleFallback) {
        onStatus("⚡ Loading sample timetable preview…");
        await new Promise((r) => setTimeout(r, 200));
        return runModelOnSampleData(model);
      }

      const detectedSec = detectSectionFromInput(fileName, "");

      // Convert imageSrc to base64 if needed
      let sendImage = imageSrc;
      if (imageSrc && !imageSrc.startsWith("data:")) {
        try {
          const resp = await fetch(imageSrc);
          const b = await resp.blob();
          sendImage = await new Promise((resolve) => {
            const r = new FileReader();
            r.onloadend = () => resolve(r.result);
            r.readAsDataURL(b);
          });
        } catch (e) {
          console.warn("Could not pre-convert imageSrc to dataURL:", e);
        }
      }

      // 1. Try local server or Vercel PaddleOCR endpoint
      const isFileProto = typeof window !== "undefined" && window.location && window.location.protocol === "file:";
      const isLocal = typeof window !== "undefined" && window.location && (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1");

      const endpoints = [];
      if (isFileProto) {
        endpoints.push("http://localhost:8080/api/qwen/scan", "http://localhost:8080/api/paddleocr/scan", "https://habit-loop-flame.vercel.app/api/paddleocr/scan");
      } else if (isLocal) {
        endpoints.push("/api/qwen/scan", "/api/paddleocr/scan", "http://localhost:8080/api/qwen/scan", "http://localhost:8080/api/paddleocr/scan", "https://habit-loop-flame.vercel.app/api/paddleocr/scan");
      } else {
        endpoints.push("/api/qwen/scan", "/api/paddleocr/scan", "https://habit-loop-flame.vercel.app/api/paddleocr/scan");
      }

      for (const endpoint of endpoints) {
        try {
          onStatus("Connecting to Vision & OCR engine at " + endpoint + "…");
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 8000);

          const proxyResp = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image: sendImage,
              fileName: fileName,
              section: detectedSec || "",
              isSample: false
            }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (proxyResp.ok) {
            const resJson = await proxyResp.json();
            if (resJson.success && resJson.classes && resJson.classes.length > 0) {
              const engineName = resJson.engine ? resJson.engine : (resJson.section_name || (resJson.section ? "Section " + resJson.section : "PaddleOCR-VL"));
              onStatus("✨ Loaded " + resJson.classes.length + " classes via " + engineName + "!");
              return resJson.classes;
            }
            if (resJson.success && (resJson.markdown || resJson.table_html)) {
              onStatus("PaddleOCR-VL pipeline completed! Parsing extracted layout…");
              const dataToParse = resJson.markdown || resJson.table_html;
              const parsed = parsePaddleOcrMarkdownOrTable(dataToParse, model);
              if (parsed && parsed.length >= 2) {
                return parsed;
              }
            } else if (resJson.fallback_client_ocr) {
              console.info("Server requested client OCR processing.");
              break;
            }
          }
        } catch (proxyErr) {
          console.warn("PaddleOCR endpoint " + endpoint + " unavailable:", proxyErr);
        }
      }

      // If fileName had a detected calibrated section and server was not reachable:
      if (detectedSec) {
        const secClasses = getCalibratedSectionSchedule(detectedSec);
        if (secClasses && secClasses.length > 0) {
          onStatus("✨ Loaded " + secClasses.length + " classes from Section " + detectedSec + " layout!");
          return secClasses;
        }
      }

      // 2. High-precision In-Browser Client OCR fallback directly on the uploaded image
      onStatus("Analyzing uploaded image with high-precision client document OCR…");
      try {
        const clientClasses = await runLocalOcrModel(
          sendImage || imageSrc,
          model,
          (progress) => {
            onStatus("Document OCR scanning in progress (" + Math.round(progress * 100) + "%)…");
          },
          fileName,
          detectedSec || ""
        );

        if (clientClasses && clientClasses.length >= 2) {
          onStatus("Successfully extracted " + clientClasses.length + " timetable classes!");
          return clientClasses;
        }
      } catch (clientErr) {
        console.warn("Client OCR scanning failed:", clientErr);
      }

      // Fallback if section was detected
      if (detectedSec) {
        return getCalibratedSectionSchedule(detectedSec);
      }

      throw new Error("Could not detect any timetable classes from the uploaded image. Please ensure the timetable image is clear, sharp, and well-lit.");
    }

    function computeFreeBlocks(classes, workingTasks, nowMinutes) {
      const busy = [
        ...classes.map((c) => [c.start, c.end]),
        ...workingTasks
          .filter((t) => t.start != null && t.status !== "dropped" && t.status !== "done")
          .map((t) => [t.start, t.end]),
      ].sort((a, b) => a[0] - b[0]);
      const merged = [];
      for (const [s, e] of busy) {
        if (merged.length && s <= merged[merged.length - 1][1]) {
          merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], e);
        } else {
          merged.push([s, e]);
        }
      }
      const free = [];
      let cursor = Math.max(DAY_START, nowMinutes);
      for (const [s, e] of merged) {
        if (s > cursor) free.push([cursor, s]);
        cursor = Math.max(cursor, e);
      }
      if (cursor < DAY_END) free.push([cursor, DAY_END]);
      return free.filter(([s, e]) => e - s >= 15);
    }

    function avgEnergyForRange(hourlyEnergy, start, end) {
      let totalWeighted = 0, cursor = start;
      while (cursor < end) {
        const hour = Math.floor(cursor / 60) % 24;
        const hourEnd = Math.min(end, (Math.floor(cursor / 60) + 1) * 60);
        totalWeighted += (hourlyEnergy[hour] ?? 3) * (hourEnd - cursor);
        cursor = hourEnd;
      }
      return totalWeighted / (end - start);
    }

    function findBestSlot(freeBlocks, minutes, cognitiveLoad, hourlyEnergy) {
      let best = null, bestScore = -Infinity;
      for (const [s, e] of freeBlocks) {
        for (let start = s; start + minutes <= e; start += 15) {
          const avg = avgEnergyForRange(hourlyEnergy, start, start + minutes);
          const score = cognitiveLoad === "boulder" ? avg : 5 - avg;
          if (score > bestScore) {
            bestScore = score;
            best = { start, end: start + minutes };
          }
        }
      }
      return best;
    }

    function AnalogClockFace({ hour = 12, minute = 0, size = 100, accentColor = "#3FD6C4" }) {
      const h12 = hour % 12;
      const hourAngle = (h12 + minute / 60) * 30;
      const minuteAngle = minute * 6;
      const ticks = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];

      return (
        <div style={{ display: "inline-flex", flexDirection: "column", alignItems: "center" }}>
          <svg width={size} height={size} viewBox="0 0 100 100" style={{ filter: "drop-shadow(0 4px 12px rgba(0,0,0,0.5))" }}>
            {/* Outer Dial Circle */}
            <circle cx="50" cy="50" r="46" fill="#1A1D27" stroke="#2E3345" strokeWidth="2.5" />
            <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="1" />

            {/* Hour markers */}
            {ticks.map((deg) => {
              const isMajor = deg % 90 === 0;
              const rad = (deg - 90) * (Math.PI / 180);
              const r1 = isMajor ? 36 : 38;
              const r2 = 42;
              const x1 = 50 + r1 * Math.cos(rad);
              const y1 = 50 + r1 * Math.sin(rad);
              const x2 = 50 + r2 * Math.cos(rad);
              const y2 = 50 + r2 * Math.sin(rad);
              return (
                <line
                  key={deg}
                  x1={x1}
                  y1={y1}
                  x2={x2}
                  y2={y2}
                  stroke={isMajor ? accentColor : "#5A6178"}
                  strokeWidth={isMajor ? 2.2 : 1.2}
                  strokeLinecap="round"
                />
              );
            })}

            {/* Hour Hand */}
            <line
              x1="50"
              y1="50"
              x2={50 + 23 * Math.cos((hourAngle - 90) * (Math.PI / 180))}
              y2={50 + 23 * Math.sin((hourAngle - 90) * (Math.PI / 180))}
              stroke="#EEF0F5"
              strokeWidth="3.2"
              strokeLinecap="round"
            />

            {/* Minute Hand */}
            <line
              x1="50"
              y1="50"
              x2={50 + 33 * Math.cos((minuteAngle - 90) * (Math.PI / 180))}
              y2={50 + 33 * Math.sin((minuteAngle - 90) * (Math.PI / 180))}
              stroke={accentColor}
              strokeWidth="2.4"
              strokeLinecap="round"
            />

            {/* Center Pivot Pin */}
            <circle cx="50" cy="50" r="3.5" fill={accentColor} />
            <circle cx="50" cy="50" r="1.5" fill="#12141B" />
          </svg>
        </div>
      );
    }

    function VisualClockPicker({ value = "18:00", onChange, accentColor = "#3FD6C4", title = "Interactive Clock Time" }) {
      const parts = String(value || "18:00").split(":");
      let h24 = parseInt(parts[0], 10);
      if (isNaN(h24)) h24 = 18;
      let min = parseInt(parts[1], 10);
      if (isNaN(min)) min = 0;

      const isPM = h24 >= 12;
      const h12 = h24 % 12 === 0 ? 12 : h24 % 12;

      function updateTime(newH12, newMin, newPM) {
        let final24 = newH12 % 12;
        if (newPM) final24 += 12;
        const hhStr = String(final24).padStart(2, "0");
        const mmStr = String(newMin).padStart(2, "0");
        onChange(`${hhStr}:${mmStr}`, { hour: final24, minute: newMin });
      }

      function incHour() {
        const nextH = h12 === 12 ? 1 : h12 + 1;
        updateTime(nextH, min, isPM);
      }
      function decHour() {
        const nextH = h12 === 1 ? 12 : h12 - 1;
        updateTime(nextH, min, isPM);
      }
      function incMin(step = 5) {
        let nextM = min + step;
        let nextH = h12;
        let nextPM = isPM;
        if (nextM >= 60) {
          nextM = nextM % 60;
          nextH = h12 === 12 ? 1 : h12 + 1;
          if (h12 === 11) nextPM = !isPM;
        }
        updateTime(nextH, nextM, nextPM);
      }
      function decMin(step = 5) {
        let nextM = min - step;
        let nextH = h12;
        let nextPM = isPM;
        if (nextM < 0) {
          nextM = (nextM + 60) % 60;
          nextH = h12 === 1 ? 12 : h12 - 1;
          if (h12 === 12) nextPM = !isPM;
        }
        updateTime(nextH, nextM, nextPM);
      }

      const ampmStr = isPM ? "PM" : "AM";
      const displayTime12 = `${h12}:${String(min).padStart(2, "0")} ${ampmStr}`;

      return (
        <div style={{ background: "#171A23", border: "1px solid #282C3C", borderRadius: 10, padding: 14 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
              <ClockIcon size={15} color={accentColor} />
              <span style={{ fontSize: 12.5, fontWeight: 700, color: "#EEF0F5" }}>{title}</span>
            </div>
            <div style={{ background: "rgba(63,214,196,0.12)", border: `1px solid ${accentColor}`, color: accentColor, borderRadius: 6, padding: "3px 9px", fontSize: 13.5, fontWeight: 700, letterSpacing: 0.3 }}>
              {displayTime12}
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-around", gap: 14, flexWrap: "wrap" }}>
            {/* Analog Clock Dial */}
            <AnalogClockFace hour={h24} minute={min} size={98} accentColor={accentColor} />

            {/* Steppers & Digits */}
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {/* Hours Box */}
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                <button
                  type="button"
                  onClick={incHour}
                  style={{ background: "#202433", border: "1px solid #2E3345", color: "#EEF0F5", borderRadius: 5, width: 44, height: 26, cursor: "pointer", fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center" }}
                  title="Increase hour"
                >
                  ▲
                </button>
                <div style={{ width: 44, padding: "8px 0", textAlign: "center", fontFamily: "'Space Grotesk', monospace", fontSize: 20, fontWeight: 700, color: "#EEF0F5", background: "#12141B", border: "1px solid #282C3C", borderRadius: 6, margin: "4px 0" }}>
                  {String(h12).padStart(2, "0")}
                </div>
                <button
                  type="button"
                  onClick={decHour}
                  style={{ background: "#202433", border: "1px solid #2E3345", color: "#EEF0F5", borderRadius: 5, width: 44, height: 26, cursor: "pointer", fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center" }}
                  title="Decrease hour"
                >
                  ▼
                </button>
                <span style={{ fontSize: 9.5, color: "#8E95A8", marginTop: 2, fontWeight: 600 }}>HOUR</span>
              </div>

              <div style={{ fontSize: 20, fontWeight: 700, color: "#8E95A8", alignSelf: "center", paddingBottom: 16 }}>
                :
              </div>

              {/* Minutes Box */}
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                <button
                  type="button"
                  onClick={() => incMin(5)}
                  style={{ background: "#202433", border: "1px solid #2E3345", color: "#EEF0F5", borderRadius: 5, width: 44, height: 26, cursor: "pointer", fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center" }}
                  title="Increase minutes by 5"
                >
                  ▲
                </button>
                <div style={{ width: 44, padding: "8px 0", textAlign: "center", fontFamily: "'Space Grotesk', monospace", fontSize: 20, fontWeight: 700, color: "#EEF0F5", background: "#12141B", border: "1px solid #282C3C", borderRadius: 6, margin: "4px 0" }}>
                  {String(min).padStart(2, "0")}
                </div>
                <button
                  type="button"
                  onClick={() => decMin(5)}
                  style={{ background: "#202433", border: "1px solid #2E3345", color: "#EEF0F5", borderRadius: 5, width: 44, height: 26, cursor: "pointer", fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center" }}
                  title="Decrease minutes by 5"
                >
                  ▼
                </button>
                <span style={{ fontSize: 9.5, color: "#8E95A8", marginTop: 2, fontWeight: 600 }}>MIN</span>
              </div>

              {/* AM / PM Toggle Stack */}
              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginLeft: 4, paddingBottom: 16 }}>
                <button
                  type="button"
                  onClick={() => updateTime(h12, min, false)}
                  style={{
                    background: !isPM ? accentColor : "#202433",
                    border: `1px solid ${!isPM ? accentColor : "#2E3345"}`,
                    color: !isPM ? "#08211E" : "#8E95A8",
                    borderRadius: 5,
                    padding: "6px 9px",
                    fontSize: 11,
                    fontWeight: 700,
                    cursor: "pointer",
                  }}
                >
                  AM
                </button>

    function DeadlineTimerPicker({ value = "18:00", onChange, accentColor = "#3FD6C4", now, defaultTab = "clock" }) {
      const [pickerTab, setPickerTab] = useState(defaultTab); // "clock" or "timer"
      const [timerMins, setTimerMins] = useState(120); // default 2 hours from now

      function applyTimer(durationMinutes) {
        setTimerMins(durationMinutes);
        const refDate = now || new Date();
        const targetDate = new Date(refDate.getTime() + durationMinutes * 60000);
        const hh = String(targetDate.getHours()).padStart(2, "0");
        const mm = String(targetDate.getMinutes()).padStart(2, "0");
        onChange(`${hh}:${mm}`);
      }

      function adjustTimer(deltaMinutes) {
        const next = Math.max(15, timerMins + deltaMinutes);
        applyTimer(next);
      }

      const hrs = Math.floor(timerMins / 60);
      const minsRemaining = timerMins % 60;
      const durationLabel = `${hrs > 0 ? `${hrs}h ` : ""}${minsRemaining > 0 || hrs === 0 ? `${minsRemaining}m` : ""}`.trim();

      const refDate = now || new Date();
      const computedDate = new Date(refDate.getTime() + timerMins * 60000);
      const computedH24 = computedDate.getHours();
      const computedMin = computedDate.getMinutes();
      const computedPM = computedH24 >= 12;
      const computedH12 = computedH24 % 12 === 0 ? 12 : computedH24 % 12;
      const computedStr = `${computedH12}:${String(computedMin).padStart(2, "0")} ${computedPM ? "PM" : "AM"}`;

      return (
        <div style={{ background: "#171A23", border: "1px solid #282C3C", borderRadius: 10, padding: 12, marginTop: 6 }}>
          {/* Mode Switcher Tabs */}
          <div style={{ display: "flex", gap: 6, marginBottom: 12, background: "#12141B", padding: 4, borderRadius: 8, border: "1px solid #232736" }}>

                flex: 1,

                border: "none",
                color: pickerTab === "clock" ? "#08211E" : "#8E95A8",
                borderRadius: 6,
                padding: "7px 0",
                fontSize: 12,
                fontWeight: 700,
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 6,
              }}
            >
              <ClockIcon size={14} /> Interactive Clock
            </button>
            <button
              type="button"
              onClick={() => {
                setPickerTab("timer");
                applyTimer(timerMins);
              }}
              style={{
                flex: 1,
                background: pickerTab === "timer" ? accentColor : "transparent",
                border: "none",
                color: pickerTab === "timer" ? "#08211E" : "#8E95A8",
                borderRadius: 6,
                padding: "7px 0",
                fontSize: 12,
                fontWeight: 700,
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 6,
              }}
            >
              <Timer size={14} /> Set via Timer (Duration)
            </button>
          </div>

          {pickerTab === "clock" ? (
            <div>
              <VisualClockPicker
                value={value}
                onChange={(hhmm) => onChange(hhmm)}
                accentColor={accentColor}
                title="Pick Deadline Time"
              />

              {/* Quick Preset Chips */}
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 10 }}>
                {[
                  { label: "12:00 PM", val: "12:00" },
                  { label: "3:00 PM", val: "15:00" },
                  { label: "6:00 PM", val: "18:00" },
                  { label: "9:00 PM", val: "21:00" },
                  { label: "11:59 PM", val: "23:59" },
                ].map((chip) => (
                  <button
                    key={chip.val}

                    onClick={() => onChange(chip.val)}
                    style={{

                    }}

                    {chip.label}
                  </button>

              </div>

          ) : (
            <div>

              <div style={{ background: "#12141B", border: "1px solid #282C3C", borderRadius: 8, padding: 12, marginBottom: 12 }}>
                <div style={{ fontSize: 11.5, color: "#8E95A8", marginBottom: 8, textAlign: "center" }}>

    // ---------------------------------------------------------------------------
    // CONSISTENCY MATRIX (28D) & ANTI-PROCRASTINATION BUFFER
    // ---------------------------------------------------------------------------
    function ConsistencyMatrix28D({
      habits = [],
      now = new Date(),
      activeDay = null,
      onSelectDay = () => {},
      onToggleHabitDay = null
    }) {
      const days = ["M", "T", "W", "T", "F", "S", "S"];
      const dayKeys = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
      const dayNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      // Monday-indexed day of week: Mon=0, Tue=1, Wed=2, Thu=3, Fri=4, Sat=5, Sun=6
      const currentDayIdx = (now.getDay() + 6) % 7;
      const currentDayKey = dayKeys[currentDayIdx];

      // Total slots = habits.length * 7 days
      const totalHabits = habits.length;
      const totalSlots = Math.max(1, totalHabits * 7);

      // Live total completed checkmarks across all habits
      const totalDoneAllHabits = habits.reduce(
        (sum, h) => sum + Object.values(h.logs || {}).filter(Boolean).length,
        0
      );

      // Live consistency rate across all active habit slots
      const consistencyRate = totalHabits > 0 ? Math.min(100, Math.max(0, (totalDoneAllHabits / totalSlots) * 100)) : 0;
      const formattedRate = consistencyRate.toFixed(1) + "%";

      // Dynamic Lock Status
      let lockText = "RELOAD";
      let lockColor = "#FF8A5C";
      if (consistencyRate >= 80) {
        lockText = "LOCK";
        lockColor = "#3CD09B";
      } else if (consistencyRate >= 50) {
        lockText = "ACTIVE";
        lockColor = "#3FD6C4";
      } else if (consistencyRate > 0) {
        lockText = "BUILDING";
        lockColor = "#E3B23C";
      } else {
        lockText = "RELOAD";
        lockColor = "#FF8A5C";
      }

      // Live Anti-Procrastination Buffer: Boulder habits avert friction stalls
      const boulderHabits = habits.filter((h) => h.load === "boulder");
      const boulderLogsCount = boulderHabits.reduce(
        (sum, h) => sum + Object.values(h.logs || {}).filter(Boolean).length,
        0
      );
      const stallsAverted = boulderLogsCount;
      const bufferMinutes = totalDoneAllHabits * 15 + boulderLogsCount * 15;

      // Dynamic matrix dimension label: 28D for 4 habits, 35D for 5, 42D for 6, etc.
      const matrixDimension = totalHabits * 7;
      const dimensionLabel = totalHabits === 4 ? "28D" : `${matrixDimension}D`;

      // Matrix Rows: 1 Row per Habit, 7 Columns (M T W T F S S)
      const matrixRows = habits.map((h, rIdx) => {
        return dayKeys.map((dKey, cIdx) => {
          const isDone = !!h.logs?.[dKey];
          const isToday = (cIdx === currentDayIdx);
          const isPast = (cIdx < currentDayIdx);
          const isSelected = activeDay === dKey;

          let color = "#191D2B";
          let border = "1px solid #232838";
          let glow = false;
          let glowColor = "none";

          if (isDone) {
            color = "#3CD09B";
            border = "1px solid #3CD09B";
            glow = true;
            glowColor = "0 0 8px rgba(60, 208, 155, 0.45)";
          } else {
            color = "#161925";
            border = "1px solid #222636";
            glow = false;
            glowColor = "none";
          }

          const label = `${h.name} (${h.category}) • ${dayNames[cIdx]}: ${isDone ? "Done ✓" : "Pending"} • Click to toggle`;

          return {
            habitId: h.id,
            habitName: h.name,
            habitColor: h.color,
            dayKey: dKey,
            dayIndex: cIdx,
            isDone,
            isToday,
            isSelected,
            color,
            border,
            glow,
            glowColor,
            label
          };
        });
      });

      return (
        <div className="rp-consistency-card" style={{
          background: "#12151E",
          border: "1px solid #202434",
          borderRadius: 12,
          padding: "18px 20px",
          marginBottom: 16,
        }}>
          {/* Top Label */}
          <div style={{
            fontSize: 11,
            fontWeight: 700,
            color: "#6D758B",
            letterSpacing: 1.4,
            textTransform: "uppercase",
            marginBottom: 6,
            fontFamily: "'Space Grotesk', monospace"
          }}>
            LOOP INTELLIGENCE
          </div>

          {/* Title & Top Right Metric (Live Computed from Habit Matrix) */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
            <div>
              <div style={{
                fontSize: 21,
                fontWeight: 700,
                color: "#EEF0F5",
                fontFamily: "'Space Grotesk', sans-serif",
                lineHeight: 1.25,
                letterSpacing: -0.3
              }}>
                Consistency<br />Matrix ({dimensionLabel})
              </div>
              <div style={{ fontSize: 11.5, color: "#6D758B", marginTop: 4, fontFamily: "'Space Grotesk', monospace" }}>
                {totalHabits} {totalHabits === 1 ? "habit" : "habits"} × 7 days
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{
                fontSize: 17,
                fontWeight: 700,
                color: lockColor,
                fontFamily: "'Space Grotesk', monospace",
                lineHeight: 1
              }}>
                {formattedRate}
              </div>
              <div style={{
                fontSize: 11.5,
                fontWeight: 700,
                color: lockColor,
                letterSpacing: 1.5,
                marginTop: 3,
                fontFamily: "'Space Grotesk', monospace"
              }}>
                {lockText}
              </div>
            </div>
          </div>

          {/* Weekday Column Headers (M T W T F S S) */}
          <div className="rp-consistency-grid" style={{
            display: "grid",
            gridTemplateColumns: "repeat(7, 1fr)",
            gap: 7,
            marginBottom: 10,
            textAlign: "center"
          }}>
            {days.map((d, i) => {
              const dKey = dayKeys[i];
              const isSelected = activeDay === dKey;
              return (
                <button
                  key={i}
                  type="button"
                  onClick={() => onSelectDay(activeDay === dKey ? null : dKey)}
                  title={`Click to focus ${dayNames[i]} in 7-Day Habit Matrix`}
                  style={{
                    background: isSelected ? "rgba(56, 189, 248, 0.16)" : "transparent",
                    border: isSelected ? "1px solid #38BDF8" : "1px solid transparent",
                    borderRadius: 4,
                    padding: "2px 0",
                    fontSize: 12,
                    fontWeight: 700,
                    color: isSelected ? "#38BDF8" : "#6D758B",
                    fontFamily: "'Space Grotesk', monospace",
                    cursor: "pointer"
                  }}
                >
                  {d}
                </button>
              );
            })}
          </div>

          {/* Matrix Rows: 1 Row per Habit, 7 Columns (M T W T F S S) */}
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {matrixRows.length === 0 ? (
              <div style={{ padding: "18px 0", textAlign: "center", fontSize: 12, color: "#6D758B" }}>
                No habits yet. Click <b>+ New Habit</b> to start your consistency loop.
              </div>
            ) : (
              matrixRows.map((row, rIdx) => {
                const h = habits[rIdx];
                return (
                  <div key={h?.id || rIdx} className="rp-consistency-grid" style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 7 }}>
                    {row.map((cell, cIdx) => (
                      <div
                        key={cell.dayKey}
                        className="rp-consistency-cell"
                        title={cell.label}
                        onClick={() => {
                          if (onToggleHabitDay) {
                            onToggleHabitDay(cell.habitId, cell.dayKey);
                          } else {
                            onSelectDay(activeDay === cell.dayKey ? null : cell.dayKey);
                          }
                        }}
                        style={{
                          height: 23,
                          borderRadius: 4,
                          background: cell.color,
                          boxShadow: cell.glow ? cell.glowColor : cell.isSelected ? "0 0 10px rgba(56, 189, 248, 0.5)" : "none",
                          border: cell.border,
                          transition: "transform 0.15s ease, filter 0.15s ease, box-shadow 0.2s ease",
                          cursor: "pointer",
                          position: "relative"
                        }}
                        onMouseEnter={(e) => (e.currentTarget.style.filter = "brightness(1.22)")}
                        onMouseLeave={(e) => (e.currentTarget.style.filter = "none")}
                      />
                    ))}
                  </div>
                );
              })
            )}
          </div>

          {/* Sync Legend & Focus Status */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, fontSize: 11, color: "#6D758B", flexWrap: "wrap", gap: 6 }}>
            <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
              <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#3CD09B", display: "inline-block" }} />
              1 row per habit · Live synced (click cell to log)
            </span>
            <span style={{ color: activeDay ? "#38BDF8" : "#8E95A8", fontWeight: 600 }}>
              {activeDay ? `Day Focus: ${activeDay.toUpperCase()}` : `Today: ${dayNames[currentDayIdx]}`}
            </span>
          </div>

          {/* Anti-Procrastination Buffer Box (Live Connected) */}
          <div style={{
            background: "#161924",
            border: "1px solid #222636",
            borderRadius: 8,
            padding: "12px 14px",
            marginTop: 14,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 12
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{
                width: 32,
                height: 32,
                borderRadius: 6,
                background: "rgba(60, 208, 155, 0.09)",
                border: "1px solid rgba(60, 208, 155, 0.25)",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                flexShrink: 0
              }}>
                <Shield size={16} color="#3CD09B" />
              </div>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 700, color: "#EEF0F5", marginBottom: 2 }}>
                  Anti-Procrastination Buffer
                </div>
                <div style={{
                  fontSize: 11.5,
                  color: "#8E95A8",
                  fontFamily: "'Space Grotesk', monospace",
                  lineHeight: 1.35
                }}>
                  {stallsAverted} micro-stalls averted this cycle
                </div>
              </div>
            </div>
            <div style={{
              fontSize: 16,
              fontWeight: 700,
              color: "#3CD09B",
              fontFamily: "'Space Grotesk', monospace",
              letterSpacing: 0.5,
              whiteSpace: "nowrap"
            }}>
              +{bufferMinutes}m
            </div>
          </div>
        </div>
      );
    }

      async function sendMobileImageToDesktop(imgData, fileName) {
        if (!imgData) return;
        setMobileUploadSending(true);
        const targetSession = new URLSearchParams(window.location.search).get("session") || mobileSessionId;

        // 1. BroadcastChannel (instant for same browser / computer)
        try {
          if (typeof BroadcastChannel !== "undefined") {
            const bc = new BroadcastChannel("habitloop_mobile_sync");
            bc.postMessage({ session: targetSession, image: imgData, name: fileName });
            bc.close();
          }
        } catch (_) {}

        // 2. localStorage
        try {
          window.localStorage.setItem("hl_sync_" + targetSession, JSON.stringify({ image: imgData, name: fileName, ts: Date.now() }));
        } catch (_) {}

        // 3. Vercel Serverless Sync API (/api/sync)
        try {
          const syncRelayUrl = (typeof window !== "undefined" && window.location && window.location.origin && window.location.origin.startsWith("http") && !window.location.hostname.includes("localhost") && !window.location.hostname.includes("127.0.0.1"))
            ? `/api/sync?session=${targetSession}`
            : `https://habit-loop-flame.vercel.app/api/sync?session=${targetSession}`;
          await fetch(syncRelayUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session: targetSession, image: imgData, name: fileName }),
          });
        } catch (_) {}

        setMobileUploadSending(false);
        setMobileUploadSuccess(true);
      }

      // Listen for mobile transmissions via BroadcastChannel
      useEffect(() => {
        if (typeof BroadcastChannel === "undefined") return;
        const bc = new BroadcastChannel("habitloop_mobile_sync");
        bc.onmessage = (e) => {
          if (e.data && e.data.session === mobileSessionId && e.data.image) {
            handleReceivedMobileImage(e.data.image, e.data.name);
          }
        };
        return () => bc.close();
      }, [mobileSessionId]);

      // Listen for mobile transmissions via storage event
      useEffect(() => {
        function onStorage(e) {
          if (e.key === "hl_sync_" + mobileSessionId && e.newValue) {
            try {
              const data = JSON.parse(e.newValue);
              if (data && data.image) {
                handleReceivedMobileImage(data.image, data.name);
              }
            } catch (_) {}
          }
        }
        window.addEventListener("storage", onStorage);
        return () => window.removeEventListener("storage", onStorage);
      }, [mobileSessionId]);

      // Poll Vercel Serverless relay when upload modal is open
      useEffect(() => {
        if (!showScheduleUploadModal) return;
        const syncRelayUrl = (typeof window !== "undefined" && window.location && window.location.origin && window.location.origin.startsWith("http") && !window.location.hostname.includes("localhost") && !window.location.hostname.includes("127.0.0.1"))
          ? `/api/sync?session=${mobileSessionId}`
          : `https://habit-loop-flame.vercel.app/api/sync?session=${mobileSessionId}`;
        const timer = setInterval(async () => {
          try {
            const res = await fetch(syncRelayUrl);
            if (res.ok) {
              const json = await res.json();
              if (json && json.ready && json.data && json.data.image) {
                handleReceivedMobileImage(json.data.image, json.data.name);
              }
            }
          } catch (_) {}
        }, 2000);
        return () => clearInterval(timer);
      }, [showScheduleUploadModal, mobileSessionId]);

      async function scanAndApplySchedule(useSampleFallback = false) {
        if (!scheduleUploadImg && !useSampleFallback) {
          setScheduleScanError("Please select or drop a timetable image first.");
          return;
        }
        setIsScanningSchedule(true);
        setScheduleScanError(null);
        setScheduleScanSuccessMsg(null);
        setPaddleJobStatus("");
        if (!useSampleFallback) {
          setIsReviewingScanned(false);
          setScannedEditableClasses([]);
        }

        try {
          
          setPaddleJobStatus("Analyzing timetable layout with document OCR…");
          const normalized = await runPaddleOcrModel(
            scheduleUploadImg,
            ocrModel,
            useSampleFallback,
            (status) => setPaddleJobStatus(status),
            scheduleUploadFileName
          );

          if (!normalized || normalized.length === 0) {
            throw new Error("No timetable classes could be detected from this image. Please ensure the timetable image is clear, sharp, and well-lit.");
          }

          setScannedEditableClasses(normalized);
          setIsReviewingScanned(true);
          setTimeout(() => {
            const el = document.getElementById("schedule-review-section");
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 80);
          setLastReasoning(
            `Extracted ${normalized.length} classes from your timetable. Review and verify them below.`
          );
        } catch (err) {
          setIsReviewingScanned(false);
          setScannedEditableClasses([]);
          setScheduleScanError(err.message || "Failed to scan timetable image.");
        } finally {
          setIsScanningSchedule(false);
          setPaddleJobStatus("");
        }
      }

      function updateScannedClass(index, field, value) {
        setScannedEditableClasses((prev) =>
          prev.map((c, i) => (i === index ? { ...c, [field]: value } : c))
        );
      }

      function deleteScannedClass(index) {
        setScannedEditableClasses((prev) => prev.filter((_, i) => i !== index));
      }

      function addEmptyScannedClass() {
        setScannedEditableClasses((prev) => [
          ...prev,
          { subject: "New Subject", day: selectedDay || "mon", start: 540, end: 600 },
        ]);
      }

      function commitScannedClasses() {
        if (!scannedEditableClasses || scannedEditableClasses.length === 0) return;
        const validClasses = scannedEditableClasses.filter((c) => c.subject && c.end > c.start);
        if (validClasses.length === 0) {
          setScheduleScanError("No valid classes with valid start/end times found in review list.");
          return;
        }

        if (scheduleUploadMode === "replace") {
          setScheduleAll(validClasses);
        } else {
          setScheduleAll((prev) => [...prev, ...validClasses]);
        }

        setScannedClassesPreview(validClasses);
        setScheduleScanSuccessMsg(
          `Extracted and loaded ${validClasses.length} verified classes into your schedule (${scheduleUploadMode === "replace" ? "replaced" : "merged"})!`
        );
        setIsReviewingScanned(false);
        setShowScheduleUploadModal(false);

        if (validClasses.length > 0) {
          const hasClassToday = validClasses.some((c) => c.day === selectedDay);
          if (!hasClassToday) {
            setSelectedDay(validClasses[0].day);
          }
        }
      }

      // ---- Cloud Data Sync & Migration Handlers ----
      async function syncUserCloudData(cloudUser) {
        if (!cloudUser || !supabase) return;
        setActiveCloudUser(cloudUser.id);
        setCloudSyncStatus("syncing");

        try {
          // 1. Fetch or initialize profile record
          const { data: dbProfile } = await supabase
            .from("profiles")
            .select("*")
            .eq("id", cloudUser.id)
            .maybeSingle();

          const resolvedProfile = {
            name: dbProfile?.full_name || cloudUser.user_metadata?.full_name || cloudUser.email?.split("@")[0] || "Student",
            email: cloudUser.email,
            university: dbProfile?.university || cloudUser.user_metadata?.university || "JECRC University",
            degree: dbProfile?.degree || "B.Tech Computer Science & Engineering",
            semester: dbProfile?.semester || "4th Semester",
            studentId: dbProfile?.student_id || "23BCON047",
            dailyTargetHours: dbProfile?.daily_target_hours || 4,
            bio: dbProfile?.bio || "Striving for academic consistency, high-energy focus, and deep work.",
            cloudUserId: cloudUser.id,
            loggedInAt: new Date().toISOString()
          };

          if (!dbProfile) {
            try {
              await supabase.from("profiles").upsert({
                id: cloudUser.id,
                full_name: resolvedProfile.name,
                email: resolvedProfile.email,
                university: resolvedProfile.university,
                degree: resolvedProfile.degree,
                semester: resolvedProfile.semester,
                student_id: resolvedProfile.studentId,
                daily_target_hours: resolvedProfile.dailyTargetHours,
                bio: resolvedProfile.bio,
                updated_at: new Date().toISOString()
              });
            } catch (pErr) {
              console.warn("Profile table upsert note:", pErr);
            }
          }

          setProfile(resolvedProfile);
          saveJSON("data:currentUser", resolvedProfile);

          // 2. Fetch existing cloud user_data
          const { data: userRecords, error: dataErr } = await supabase
            .from("user_data")
            .select("key, value")
            .eq("user_id", cloudUser.id);

          if (!dataErr && userRecords && userRecords.length > 0) {
            userRecords.forEach((record) => {
              try { window.localStorage.setItem(record.key, JSON.stringify(record.value)); } catch (_) {}
              if (record.key === "data:habits" && Array.isArray(record.value)) {
                setHabits(record.value);
              } else if (record.key === "data:schedule" && Array.isArray(record.value)) {
                setScheduleAll(record.value);
              } else if (record.key === "data:targets" && record.value && typeof record.value === "object") {
                setTargetsByDate(record.value);
              } else if (record.key === "data:hourlyEnergy" && record.value && typeof record.value === "object") {
                setHourlyEnergy(record.value);
              }
            });
          } else {
            // New user account: Migrate current local state to cloud
            await migrateLocalDataToCloud(cloudUser.id);
          }

          setCloudSyncStatus("synced");
        } catch (err) {
          console.warn("Error in syncUserCloudData:", err);
          setCloudSyncStatus("error");
        }
      }

            { key: "data:hourlyEnergy", value: hourlyEnergy }

            user_id: uid,
            key: item.key,
            value: item.value,
            updated_at: new Date().toISOString()
          }));

          await supabase.from("user_data").upsert(upsertPayload);
          console.log("Successfully migrated local data to Supabase cloud for user:", uid);
        } catch (err) {
          console.warn("Cloud data migration note:", err);
        }
      }

      function saveEditedTarget() {
        const text = editTargetText.trim();
        if (!text || !editingTargetId) return;

        let deadlineStr = "No deadline";
        if (editTargetDeadlineType === "none") {
          deadlineStr = "No deadline";
        } else if (editTargetDeadlineCustom) {
          const minsVal = hhmmToMinutes(editTargetDeadlineCustom);
          const h24 = Math.floor(minsVal / 60) % 24;
          const m = minsVal % 60;
          const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
          const ampm = h24 < 12 ? "AM" : "PM";
          const formattedTime = `${h12}:${String(m).padStart(2, "0")} ${ampm}`;
          if (editTargetDeadlineType === "eod" && editTargetDeadlineCustom === "23:59") {
            deadlineStr = "End of Day (11:59 PM)";
          } else {
            deadlineStr = formattedTime;
          }
        }

        const cogLoad = editTargetDifficulty === "easy" ? "ramp" : "boulder";
        const mins = editTargetMinutes || 30;

        setTargetsByDate((prev) => {
          const list = prev[todayDateKey] || [];
          return {
            ...prev,
            [todayDateKey]: list.map((t) => {
              if (t.id === editingTargetId) {
                return {
                  ...t,
                  text,
                  deadline: deadlineStr,
                  difficulty: editTargetDifficulty,
                  estimatedMinutes: mins,
                  cognitiveLoad: cogLoad,
                };
              }
              return t;
            }),
          };
        });

        // Also sync with timeline task if slotted
        const currentList = targetsByDate[todayDateKey] || [];
        const target = currentList.find((t) => t.id === editingTargetId);
        if (target && target.linkedTaskId) {
          setTasks((prevTasks) =>
            prevTasks.map((task) => {
              if (task.id === target.linkedTaskId) {
                const newEnd = task.start != null ? task.start + mins : null;
                return {
                  ...task,
                  title: `[Target] ${text}`,
                  minutes: mins,
                  cognitiveLoad: cogLoad,
                  deadline: deadlineStr,
                  end: newEnd,
                  priority: editTargetDifficulty === "hard" ? 85 : editTargetDifficulty === "medium" ? 60 : 35,
                };
              }
              return task;
            })
          );
        }

        setShowEditTargetModal(false);
        setEditingTargetId(null);
      }

      function scheduleTargetIntoRamp(tg) {
        const freeBlocks = computeFreeBlocks(classesForToday, tasks, nowMinutes);
        const mins = tg.estimatedMinutes || 30;
        const load = tg.cognitiveLoad || (tg.difficulty === "easy" ? "ramp" : "boulder");
        const slot = findBestSlot(freeBlocks, mins, load, hourlyEnergy);
        const newTask = {
          id: newId("tg-task"),
          title: `[Target] ${tg.text}`,
          cognitiveLoad: load,
          minutes: mins,
          priority: tg.difficulty === "hard" ? 85 : tg.difficulty === "medium" ? 60 : 35,
          status: slot ? "scheduled" : "pending",
          start: slot ? slot.start : null,
          end: slot ? slot.end : null,
          deadline: tg.deadline || "No deadline",
          isUrgent: false,
          microSliced: false,
          parentId: null,
          pairedWith: null,
        };
        setTasks((prev) => [...prev, newTask]);
        setTargetsByDate((prev) => ({
          ...prev,
          [todayDateKey]: (prev[todayDateKey] || []).map((t) =>
            t.id === tg.id ? { ...t, linkedTaskId: newTask.id } : t
          ),
        }));
        setLastReasoning(
          slot
            ? `Slotted target "${tg.text}" (${mins}m ${load}) into ${fmtTime(slot.start)}–${fmtTime(slot.end)}.`
            : `Added target "${tg.text}" to pending tasks queue.`
        );
        setDashboardTab("schedule");
      }

      function addTarget() {
        const text = newTargetText.trim();
        if (!text) return;
        setTargetsByDate((prev) => ({
          ...prev,
          [todayDateKey]: [...(prev[todayDateKey] || []), { id: newId("target"), text, done: false, deadline: "No deadline", difficulty: "medium", estimatedMinutes: 30, cognitiveLoad: "boulder", linkedTaskId: null }],
        }));
        setNewTargetText("");
      }

      function toggleTarget(id) {
        const list = targetsByDate[todayDateKey] || [];
        const target = list.find((tg) => tg.id === id);
        if (target && target.linkedTaskId) {
          const newDone = !target.done;
          setTasks((prevTasks) =>
            prevTasks.map((t) => (t.id === target.linkedTaskId ? { ...t, status: newDone ? "done" : t.start != null ? "scheduled" : "pending" } : t))
          );
        }
        setTargetsByDate((prev) => ({
          ...prev,
          [todayDateKey]: (prev[todayDateKey] || []).map((tg) => (tg.id === id ? { ...tg, done: !tg.done } : tg)),
        }));
